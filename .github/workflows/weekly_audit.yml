name: Weekly Audit Runner

on:
  schedule:
    - cron: '0 0 * * 1'  # Runs every Monday at 00:00 UTC
  workflow_dispatch:      # Allows manual one-click runs

jobs:
  run-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 dnspython urllib3

      - name: Execute Audit for all 23 properties
        run: |
          python run_full_audit.py

      - name: Save Results & History Archives
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add audit_results.json history/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly audit report and archive history [skip ci]" && git pull --rebase origin main && git push origin main)
