name: Weekly Audit Runner

on:
  schedule:
    - cron: '0 0 * * 1'  # Automatically runs every Monday at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger anytime

jobs:
  run-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 dnspython

      - name: Execute Audit for all 23 properties
        run: |
          python run_full_audit.py

      - name: Save Results
        run: |
          git config --global user.name "Audit Bot"
          git config --global user.email "bot@github.com"
          git add audit_results.json
          git commit -m "Auto-update weekly audit report across 23 websites" || echo "No changes"
          git push
