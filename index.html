<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITC Website Compliance Dashboard</title>
<style>
:root{
  --bg:#eef1f6; --surface:#fff; --surface2:#f7f9fc;
  --ink:#182033; --ink2:#586179; --ink3:#8a94a9; --line:#e5e9f1; --line2:#eef2f8;
  --accent:#00338d; --accent-soft:#eef2ff;
  --pass:#12b76a; --pass-bg:#e7f7ef; --pass-ink:#0f8a52;
  --warn:#f59e0b; --warn-bg:#fef4e2; --warn-ink:#b6740a;
  --fail:#ef4444; --fail-bg:#fdecec; --fail-ink:#c53030;
  --na:#94a3b8;   --na-bg:#eef1f6;   --na-ink:#647085;
  --info:#0ea5e9; --info-bg:#e6f6fe; --info-ink:#0b82b8;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 3px 12px rgba(16,24,40,.05);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd4e3;border-radius:8px;border:2px solid var(--bg)}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}

/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .top{padding:16px 18px;border-bottom:1px solid var(--line2)}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:46px;width:auto;object-fit:contain;mix-blend-mode:multiply;flex-shrink:0}
.logo h1{font-size:14px;font-weight:700;line-height:1.15;color:#00338d}
.logo p{font-size:11px;color:var(--ink3);margin-top:2px;letter-spacing:0.2px}
.navscroll{flex:1;overflow-y:auto;padding:10px 12px 16px}
.grp{font-size:10px;font-weight:700;letter-spacing:.9px;color:var(--ink3);text-transform:uppercase;padding:14px 10px 6px}
.nitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--ink2);transition:.12s;margin-bottom:2px}
.nitem:hover{background:var(--surface2);color:var(--ink)}
.nitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nitem .ico{width:20px;text-align:center;font-size:15px;flex:0 0 auto}
.nitem .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .sc{font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--surface2)}
.nitem.active .sc{background:#fff}
.nitem .sdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.nsub{padding-left:8px;border-left:2px solid var(--line2);margin-left:14px}
.side .foot{padding:12px;border-top:1px solid var(--line2)}
.dlbtn{width:100%;border:none;background:var(--accent);color:#fff;padding:10px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.dlbtn:hover{background:#002266}
.dlbtn.ghost{background:var(--surface2);color:var(--ink2);border:1px solid var(--line);margin-top:8px}

/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20}
.crumb{font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:7px}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--ink3)}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.updated{font-size:12px;color:var(--ink3)}
.content{padding:26px 30px 60px;max-width:1220px;width:100%;margin:0 auto}
.page-h{margin-bottom:20px}
.page-h h2{font-size:21px;font-weight:700}
.page-h p{font-size:13px;color:var(--ink2);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.block-title{font-size:13px;font-weight:700;margin:26px 2px 12px;display:flex;align-items:center;gap:8px}
.block-title .hint{font-size:11px;font-weight:500;color:var(--ink3)}
.ring{position:relative;flex:0 0 auto}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .val b{font-weight:800;line-height:1}
.ring .val small{font-size:11px;color:var(--ink3);margin-top:3px}
.s-pass{color:var(--pass)}.bg-pass{background:var(--pass)}.soft-pass{background:var(--pass-bg);color:var(--pass-ink)}
.s-warn{color:var(--warn)}.bg-warn{background:var(--warn)}.soft-warn{background:var(--warn-bg);color:var(--warn-ink)}
.s-fail{color:var(--fail)}.bg-fail{background:var(--fail)}.soft-fail{background:var(--fail-bg);color:var(--fail-ink)}
.s-na{color:var(--na-ink)}.bg-na{background:var(--na)}.soft-na{background:var(--na-bg);color:var(--na-ink)}
.s-info{color:var(--info)}.bg-info{background:var(--info)}.soft-info{background:var(--info-bg);color:var(--info-ink)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.badge .d{width:7px;height:7px;border-radius:50%}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}

/* ===== PORTFOLIO ===== */
.pf-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .t{font-size:12px;color:var(--ink2)}
.kpi .n{font-size:28px;font-weight:800;margin-top:6px}
.kpi .sub{font-size:11px;color:var(--ink3);margin-top:2px}
.sitecards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sitecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;cursor:pointer;transition:.14s}
.sitecard:hover{border-color:var(--accent);transform:translateY(-2px)}
.sitecard .hd{display:flex;align-items:center;gap:14px}
.sitecard .hd .nm b{font-size:15px;display:block}
.sitecard .hd .nm small{font-size:12px;color:var(--ink3)}
.sitecard .rate{margin-top:14px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
.sitecard .mrow{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.sitecard .mrow .mi{text-align:center;flex:1}
.sitecard .mrow .mi b{display:block;font-size:18px;font-weight:800}
.sitecard .mrow .mi span{color:var(--ink3);font-size:11px}
.sitecard .go{margin-top:14px;font-size:13px;font-weight:600;color:var(--accent);display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--line2)}

/* heatmap */
.heatwrap{overflow-x:auto}
table.heat-t{border-collapse:separate;border-spacing:6px;width:100%;min-width:640px}
table.heat-t th{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;text-align:center;font-weight:700}
table.heat-t th.rowh,table.heat-t td.rowh{text-align:left;width:230px}
table.heat-t td.rowh{font-weight:600;font-size:13px;padding-left:6px}
table.heat-t td.rowh small{display:block;color:var(--ink3);font-weight:400;font-size:11px}
.hc{border-radius:11px;padding:12px 8px;text-align:center;cursor:pointer;transition:.12s;border:1.5px solid transparent}
.hc:hover{transform:scale(1.04);box-shadow:var(--shadow)}
.hc b{font-size:18px;font-weight:800;display:block;line-height:1}
.hc small{font-size:10px;opacity:.9;display:block;margin-top:3px}
.heat-legend{display:flex;gap:14px;margin-top:14px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.heat-legend .sw{display:inline-flex;align-items:center;gap:6px}
.heat-legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* priority actions */
.pa{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line2);align-items:flex-start}
.pa:last-child{border-bottom:none}
.pa .rank{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:0 0 auto;margin-top:1px}
.pa .pb{flex:1;min-width:0}
.pa .pb .h{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pa .pb .f{font-size:12px;color:var(--ink2);margin-top:3px}
.pa .sitepill{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.sev{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}

/* ===== WEBSITE VIEW ===== */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:24px 26px;margin-bottom:18px}
.hero-info .rate{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px}
.hero-info h3{font-size:16px;margin-top:12px}
.hero-info .desc{font-size:13px;color:var(--ink2);margin-top:5px;max-width:660px}
.hero-info .ref{font-size:12px;color:var(--ink3);margin-top:12px;display:flex;gap:20px;flex-wrap:wrap}
.hero-info .ref b{color:var(--ink2);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.tile .t{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:7px}
.tile .t .d{width:9px;height:9px;border-radius:50%}
.tile .n{font-size:26px;font-weight:800;margin-top:8px}
.tile .p{font-size:11px;color:var(--ink3);margin-top:2px}
.seclist{overflow:hidden}
.secrow{display:grid;grid-template-columns:34px 1fr 180px 120px 24px;gap:16px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.12s}
.secrow:last-child{border-bottom:none}
.secrow:hover{background:var(--surface2)}
.secrow .ic{font-size:19px;text-align:center}
.secrow .nm b{font-size:14px;display:block}
.secrow .nm small{font-size:12px;color:var(--ink3)}
.mini{height:8px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.mini i{height:100%}
.secrow .scwrap{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.secrow .scwrap .pct{font-size:15px;font-weight:800;min-width:44px;text-align:right}
.chev{color:var(--ink3);text-align:center;font-size:16px}
.issue{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.issue:last-child{border-bottom:none}
.issue .bar{width:4px;border-radius:4px;flex:0 0 4px}
.issue .h{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.issue .f{font-size:12px;color:var(--ink2);margin-top:3px}
.emptyok{padding:30px;text-align:center;color:var(--ink2)}
.emptyok .big{font-size:30px}

/* ===== SECTION VIEWS ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1080px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.pf-kpis{grid-template-columns:repeat(2,1fr)}.sitecards{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.metric .top{display:flex;justify-content:space-between;align-items:flex-start}
.metric .lab{font-size:12px;color:var(--ink2)}
.metric .v{font-size:28px;font-weight:800;margin-top:8px}
.metric .v small{font-size:14px;font-weight:600;color:var(--ink3)}
.metric .gaugebar{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--pass),var(--warn) 60%,var(--fail));margin-top:
